# Serve a SPA e faz proxy de /api/* para os microsserviços (nomes do docker-compose).
# Resolver + variável: o Nginx sobe mesmo que um serviço ainda não esteja no ar.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/catalog/ {
        set $upstream http://catalog-service:8080;
        rewrite ^/api/catalog/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /api/booking/ {
        set $upstream http://booking-service:8081;
        rewrite ^/api/booking/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /api/tickets/ {
        set $upstream http://ticket-service:8084;
        rewrite ^/api/tickets/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri /index.html;
    }
}
